title = "核验 ModelScope 免费推理模型"
depends_on = ["select-providers"]
condition = "select-providers.research_modelscope == true"
description = """
只调研魔搭 ModelScope API-Inference。核对 https://modelscope.cn/docs/model-service/API-Inference/intro 、官方免费额度说明和模型 API 页面。仅收录当前支持 OpenAI 兼容或项目已实现 endpoint、且免费额度明确适用的具体模型 ID；不要收录仅能下载或本地部署的模型。

只使用 ModelScope 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"modelscope","free_basis":"...","billing_warning":"免费额度说明","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

