description = """
以 Formula 实际运行时刻为准，从官方来源寻找 free-router 尚未内置、但提供 OpenAI 兼容 API 且存在长期免费模型或明确免费额度的 Provider。输出 ONLY compact JSON：{"candidates":[{"id":"...","base_url":"...","register_url":"...","api_key_env":"...","free_basis":"...","source_urls":["..."],"models":[]}],"notes":"..."}。排除必须自托管的服务、来路不明的中转站和没有官方免费证据的平台。
"""
[steps.agent]
name = "planner"
[steps.validate]
format = "json"
required = ["candidates", "notes"]

[[steps]]
id = "build-manifest"
title = "合并免费模型清单"
depends_on = ["capture-run-time", "research-openrouter", "research-groq", "research-cerebras", "research-gemini", "research-github-models", "research-pollinations", "research-huggingface", "research-nvidia", "research-mistral", "research-sambanova", "research-ollama-cloud", "research-modelscope", "research-xiaomi-mimo", "research-dashscope", "research-volcengine-ark", "research-baichuan", "research-bigmodel", "research-qianfan", "research-siliconflow", "research-zai", "research-cloudflare", "research-custom-candidates"]
input_context = ["capture-run-time.stdout", "research-openrouter", "research-groq", "research-cerebras", "research-gemini", "research-github-models", "research-pollinations", "research-huggingface", "research-nvidia", "research-mistral", "research-sambanova", "research-ollama-cloud", "research-modelscope", "research-xiaomi-mimo", "research-dashscope", "research-volcengine-ark", "research-baichuan", "research-bigmodel", "research-qianfan", "research-siliconflow", "research-zai", "research-cloudflare", "research-custom-candidates"]
description = """
把所有 Provider 报告合并为 internal/provider/free-models.json。使用 capture-run-time.stdout 的值作为 generated_at，并作为所有模型的 verified_at。保留额度耗尽、转入计费等 billing_warning。不要补写上游报告没有证据支持的模型。冲突时采用更保守结论；无可靠免费证据的 Provider 使用 policy=unverified、models=[]。只有 OpenRouter 这类 API 明确返回逐模型零价格时才使用 zero-price；明确免费层覆盖清单中全部模型时可用 all-listed；有具体模型时使用 inventory。

输出 ONLY JSON 数组，且只能有一个文件对象：
[{"filename":"free-models.json","title":"Free model manifest","summary":"...","content":"{格式化后的 JSON 字符串}"}]

content 的顶层契约：
{"schema_version":1,"generated_at":"capture-run-time.stdout","providers":{"provider-id":{"policy":"inventory|zero-price|all-listed|unverified","free_basis":"...","billing_warning":"...","source_urls":["官方 URL"],"models":[{"id":"上游精确 ID","name":"...","type":"normal|embedding|image|audio|video|rerank|moderation","functions":["chat|chat-tools|image-understanding|image-generation|video-understanding|video-generation|audio-understanding|speech-to-text|text-to-speech|embedding|rerank|moderation"],"context_length":0,"max_output_tokens":0,"input_modalities":[],"output_modalities":[],"supported_parameters":[],"supported_endpoints":[],"free_basis":"...","source_urls":["..."],"verified_at":"capture-run-time.stdout","pricing":{"prompt":"","completion":""}}]}}}

providers 必须包含当前 21 个内置 Provider。不要把 research-custom-candidates 直接写进清单；在 summary 中只报告候选，待代码增加连接配置后再纳入。
"""
[steps.agent]
name = "planner"
[steps.validate]
format = "json"
min_items = 1
item_required = ["filename", "title", "summary", "content"]

[[steps]]
id = "write-manifest"
title = "写入免费模型清单"
depends_on = ["build-manifest"]
execution = "tool"
[steps.tool]
name = "write_files"
[steps.tool.write_files]
source = "build-manifest"
root = "internal"
dir_name = "provider"
[steps.validate]
format = "json"
required = ["directory", "files"]

[[steps]]
id = "validate-manifest"
title = "验证免费模型清单"
depends_on = ["write-manifest"]
execution = "script"
[steps.script]
command = ["go", "run", ".", "validate-model-data", "internal/provider/free-models.json"]
format = "text"
timeout = "5m"
idempotent = true
[steps.validate]
format = "json"
required = ["exit_code", "stdout", "stderr"]

[[steps]]
id = "report"
title = "报告清单更新结果"
depends_on = ["validate-manifest", "research-custom-candidates"]
input_context = ["validate-manifest.stdout", "research-custom-candidates"]
description = "简要报告清单中的 Provider/模型数量、验证结果、新 Provider 候选和需要人工复核的风险。不要重复原始 JSON 或日志。"
[steps.agent]
name = "reporter"
