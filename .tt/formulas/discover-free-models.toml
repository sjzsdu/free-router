只使用火山引擎官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"volcengine-ark","free_basis":"...","billing_warning":"额度和有效期","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
