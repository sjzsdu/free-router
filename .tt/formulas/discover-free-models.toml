formula = "discover-free-models"
description = "并发核验全部或指定 Provider 的免费模型，并生成 free-router 使用的版本化模型清单。"
version = 16
type = "workflow"

[vars]
provider = { description = "只更新指定 Provider；默认 all 更新全部 Provider。", default = "all" }
allow_large_changes = { description = "允许一次写入超过安全阈值的大规模模型变化。", default = "false" }

[preflight]

[[preflight.checks]]
type = "command"
name = "go"
command = "go"
message = "需要 Go 来读取 Provider 列表并验证生成的模型清单。"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要 jq 来保守合并并校验生成的模型清单。"

[[preflight.checks]]
type = "git"
name = "repository"
require_repo = true
message = "请在 free-router 仓库中运行此 Formula。"

[[preflight.checks]]
type = "path"
name = "manifest-directory"
path = "internal/provider"
message = "找不到 internal/provider，请在 free-router 仓库根目录运行。"

[[steps]]
id = "capture-run-time"
title = "记录本次核验时间"
execution = "script"
idempotent = true

[steps.script]
command = ["date", "-u", "+{\"timestamp\":\"%Y-%m-%dT%H:%M:%SZ\",\"file_token\":\"%Y%m%dT%H%M%SZ\"}"]
format = "json"
timeout = "10s"

[steps.validate]
format = "json"
required = ["timestamp", "file_token"]

[[steps]]
id = "list-providers"
title = "读取内置 Provider 列表"
execution = "script"
idempotent = true

[steps.script]
command = ["go", "run", ".", "providers"]
format = "json"
timeout = "5m"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "select-providers"
title = "选择本次更新的 Provider"
depends_on = ["list-providers"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/filter-free-model-providers.sh", "{{list-providers.stdout}}", "{{provider}}"]
format = "json"
timeout = "30s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "research-openrouter"
title = "核验 OpenRouter 免费模型"
depends_on = ["select-providers"]
condition = "select-providers.research_openrouter == true"
description = """
只调研 OpenRouter。直接核对 https://openrouter.ai/api/v1/models 与 https://openrouter.ai/docs/guides/routing/routers/free-models-router 。仅收录 prompt、completion 均明确为 0 的模型，以及官方 free router；不要收录低价模型、活动折扣或价格未知模型。保留官方模型 ID（通常带 :free），从 architecture、supported_parameters、top_provider 提取能力和上下文。

只使用 OpenRouter 官方来源；这是只读调研，不注册、不登录、不写文件。输出 ONLY compact JSON：
{"provider":"openrouter","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"context_length":0,"input_modalities":[],"output_modalities":[],"supported_parameters":[],"pricing":{"prompt":"0","completion":"0"},"source_urls":["官方 URL"]}],"notes":"..."}
functions 只能使用项目支持的固定能力字符串；无法确认具体零价模型时返回 models=[]，禁止猜测。
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-groq"
title = "核验 Groq Free Plan 模型"
depends_on = ["select-providers"]
condition = "select-providers.research_groq == true"
description = """
只调研 Groq。核对 https://console.groq.com/docs/models 、https://console.groq.com/docs/rate-limits 和 Groq 官方弃用公告。区分当前生产模型、preview 模型和已弃用 ID；Free Plan 有明确限额且官方模型目录当前可用的模型才可收录。不要把组织权限、项目权限或本机 API Key 状态当成免费证据。

只使用 Groq 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"groq","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"官方 API ID","functions":["chat"],"context_length":0,"max_output_tokens":0,"supported_parameters":[],"source_urls":["官方模型页"]}],"notes":"..."}
工具调用仅在官方文档明确支持时加入 chat-tools；无法确认具体模型时返回 models=[]。
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-cerebras"
title = "核验 Cerebras 免费层模型"
depends_on = ["select-providers"]
condition = "select-providers.research_cerebras == true"
description = """
只调研 Cerebras Inference。核对 https://inference-docs.cerebras.ai/models/overview 、https://inference-docs.cerebras.ai/support/rate-limits 与官方 OpenAI 兼容文档。只收录明确适用于 Free Tier、当前未弃用、可通过 chat completions 调用的模型 ID；preview/限时模型必须写入 billing_warning 或 notes。

只使用 Cerebras 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"cerebras","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"context_length":0,"max_output_tokens":0,"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-gemini"
title = "核验 Gemini API 免费层模型"
depends_on = ["select-providers", "catalog-gemini"]
condition = "discover-official-models.available.gemini == true"
input_context = ["catalog-gemini"]
description = """
只调研 Google Gemini API / AI Studio，不要混入 Vertex AI。以 catalog-gemini 中官方 /models 返回的 ID 为候选全集，再核对 https://ai.google.dev/gemini-api/docs/models 、https://ai.google.dev/gemini-api/docs/pricing 和 https://ai.google.dev/gemini-api/docs/rate-limits 。仅收录价格页明确具有 Free Tier、并可通过 Gemini API 使用的具体 API model name；禁止输出官方接口候选全集之外的 ID。

只使用 Google AI for Developers 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"gemini","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"models/...","functions":["chat"],"context_length":0,"max_output_tokens":0,"input_modalities":[],"output_modalities":[],"source_urls":["官方 URL"]}],"notes":"..."}
不要仅凭模型存在就判断免费。
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-github-models"
title = "核验 GitHub Models 免费模型"
depends_on = ["select-providers"]
condition = "select-providers.research_github_models == true"
description = """
只调研 GitHub Models。核对 https://docs.github.com/en/github-models/prototyping-with-ai-models 、https://docs.github.com/en/github-models/using-github-models/prototyping-with-ai-models#rate-limits 与 https://github.com/marketplace/models 。只收录 GitHub Models 推理 API 当前提供、可用于免费原型实验的具体 model ID；不要把 Copilot 模型或 Marketplace 页面上不可通过 inference API 调用的条目混入。

只使用 GitHub 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"github-models","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"publisher/model","functions":["chat"],"context_length":0,"source_urls":["官方模型页"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-pollinations"
title = "核验 Pollinations 免费模型"
depends_on = ["select-providers", "catalog-pollinations"]
condition = "discover-official-models.available.pollinations == true"
input_context = ["catalog-pollinations"]
description = """
只调研 Pollinations API。以 catalog-pollinations 中官方 /models 返回的 ID 为候选全集，再核对 https://enter.pollinations.ai/ 、https://github.com/pollinations/pollinations/blob/master/APIDOCS.md 及官方模型端点说明。明确区分无需 Key 的公共免费调用、Pollen 免费额度和付费模型；只收录官方明确允许免费调用的具体文本、图像、音频模型 ID，并按真实生成/理解能力标注。禁止输出官方接口候选全集之外的 ID。

只使用 Pollinations 官方站点或官方 GitHub；只读调研。输出 ONLY compact JSON：
{"provider":"pollinations","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-huggingface"
title = "核验 Hugging Face 免费额度模型"
depends_on = ["select-providers"]
condition = "select-providers.research_huggingface == true"
description = """
只调研 Hugging Face Inference Providers。核对 https://huggingface.co/docs/inference-providers/pricing 、https://huggingface.co/docs/inference-providers/index 和 OpenAI 兼容 API 文档。免费依据是账户月度 credits，不是模型零价；仅收录官方 Router 当前支持、具有明确 task/provider 映射且可通过 OpenAI 兼容入口调用的具体模型 ID。不要收录仅能自行部署的 Hub 模型。

只使用 Hugging Face 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"huggingface","free_basis":"...","billing_warning":"免费 credits 耗尽后停止或计费的说明","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-nvidia"
title = "核验 NVIDIA NIM 免费额度模型"
depends_on = ["select-providers"]
condition = "select-providers.research_nvidia == true"
description = """
只调研 NVIDIA API Catalog / build.nvidia.com。核对 https://build.nvidia.com/explore/discover 、各模型官方 API 卡片及 NVIDIA 免费 credits/rate limit 说明。只收录可在 integrate.api.nvidia.com 调用且官方提供试用 credits 的具体 model ID；区分 chat、embedding、rerank、视觉理解等 NIM endpoint。不要根据模型名字猜能力，不要收录仅支持本地部署的 NIM。

只使用 NVIDIA 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"nvidia","free_basis":"...","billing_warning":"免费 credits 说明","source_urls":["官方 URL"],"models":[{"id":"publisher/model","functions":["chat"],"context_length":0,"source_urls":["官方模型卡"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-mistral"
title = "核验 Mistral Experiment Plan 模型"
depends_on = ["select-providers"]
condition = "select-providers.research_mistral == true"
description = """
只调研 Mistral AI La Plateforme。核对 https://docs.mistral.ai/deployment/ai-studio/tier/ 、https://docs.mistral.ai/getting-started/models/models_overview/ 与官方价格页。只收录 Experiment Plan 明确允许调用的当前模型 ID；区分 chat、embedding、moderation、OCR、audio，不要把需要购买 credits 的模型推定为免费。

只使用 Mistral 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"mistral","free_basis":"...","billing_warning":"Experiment Plan 限制","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-sambanova"
title = "核验 SambaNova Free Tier 模型"
depends_on = ["select-providers"]
condition = "select-providers.research_sambanova == true"
description = """
只调研 SambaNova Cloud。核对 https://docs.sambanova.ai/cloud/docs/get-started/overview 、官方模型列表与 rate limits。仅收录 Free Tier 当前可通过 OpenAI 兼容 API 调用的具体模型 ID；区分公开模型、preview 和已下线模型。

只使用 SambaNova 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"sambanova","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"context_length":0,"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-ollama-cloud"
title = "核验 Ollama Cloud 免费层模型"
depends_on = ["select-providers"]
condition = "select-providers.research_ollama_cloud == true"
description = """
只调研 Ollama Cloud，不要混入本地 Ollama。核对 https://ollama.com/cloud 、https://docs.ollama.com/cloud 与官方 models 页面。只有官方免费层当前可远程调用的具体 cloud model ID 才能收录；说明免费层限额。模型仅本地可拉取不等于 Cloud 免费模型。

只使用 Ollama 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"ollama-cloud","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
