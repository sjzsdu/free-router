depends_on = ["select-providers", "catalog-siliconflow"]
condition = "discover-official-models.available.siliconflow == true"
input_context = ["catalog-siliconflow"]
description = """
只调研 SiliconFlow。以 catalog-siliconflow 中官方 /models 返回的 ID 为候选全集，再核对 https://cloud.siliconflow.cn/models 中明确的免费标记。仅收录当前标为免费的具体模型 ID；禁止输出接口候选全集之外的 ID，不要收录仅有赠送余额但模型本身计费的条目。

只使用 SiliconFlow 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"siliconflow","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方模型页"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-zai"
title = "核验 Z.AI 免费模型"
depends_on = ["select-providers", "catalog-zai"]
condition = "discover-official-models.available.zai == true"
input_context = ["catalog-zai"]
description = """
只调研 Z.AI Model API。以 catalog-zai 中官方 /models 返回的 ID 为候选全集，再核对 https://z.ai/model-api 、https://docs.z.ai/ 官方价格/套餐说明。禁止输出接口候选全集之外的 ID；不要把网页聊天免费使用权当成 API 免费额度。若 API 必须充值或购买 resource package，models 必须为空。

只使用 Z.AI 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"zai","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-cloudflare"
title = "核验 Cloudflare Workers AI 免费额度模型"
depends_on = ["select-providers"]
condition = "select-providers.research_cloudflare == true"
description = """
只调研 Cloudflare Workers AI。核对 https://developers.cloudflare.com/workers-ai/platform/pricing/ 、https://developers.cloudflare.com/workers-ai/models/ 和各模型官方页面。免费依据是每日 Neurons allocation；仅收录 Workers AI 当前可调用的具体 @cf/... 模型 ID，并根据官方 task 区分 chat/text-generation、embedding、image、speech recognition、translation 等能力。不要收录仅在 AI Gateway 中代理的第三方模型。

只使用 Cloudflare 官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"cloudflare","free_basis":"...","billing_warning":"每日免费 Neurons 与超额行为","source_urls":["官方 URL"],"models":[{"id":"@cf/...","functions":["chat"],"source_urls":["官方模型页"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "collect-research"
title = "汇总 Provider 专属调研结果"
depends_on = ["research-openrouter", "research-groq", "research-cerebras", "research-gemini", "research-github-models", "research-pollinations", "research-huggingface", "research-nvidia", "research-mistral", "research-sambanova", "research-ollama-cloud", "research-modelscope", "research-xiaomi-mimo", "research-dashscope", "research-volcengine-ark", "research-baichuan", "research-bigmodel", "research-qianfan", "research-siliconflow", "research-zai", "research-cloudflare"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/collect-free-model-research.sh", "{{research-openrouter}}", "{{research-groq}}", "{{research-cerebras}}", "{{research-gemini}}", "{{research-github-models}}", "{{research-pollinations}}", "{{research-huggingface}}", "{{research-nvidia}}", "{{research-mistral}}", "{{research-sambanova}}", "{{research-ollama-cloud}}", "{{research-modelscope}}", "{{research-xiaomi-mimo}}", "{{research-dashscope}}", "{{research-volcengine-ark}}", "{{research-baichuan}}", "{{research-bigmodel}}", "{{research-qianfan}}", "{{research-siliconflow}}", "{{research-zai}}", "{{research-cloudflare}}"]
format = "json"
timeout = "30s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "normalize-research"
title = "校验并归一化 Provider 调研结果"
depends_on = ["select-providers", "collect-research"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/normalize-free-model-research.sh", "{{select-providers.stdout}}", "{{collect-research.stdout}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
item_required = ["provider", "models", "accepted"]

[[steps]]
id = "discover-official-models"
title = "读取官方模型目录"
depends_on = ["select-providers"]
execution = "script"

[steps.script]
command = ["go", "run", ".", "discover-model-data", "{{provider}}"]
format = "text"
timeout = "10m"

[steps.validate]
format = "json"
required = ["providers", "checked_providers", "available", "fetch_failures", "probe_failures"]

[[steps]]
id = "catalog-gemini"
title = "裁剪 Gemini 官方候选目录"
depends_on = ["discover-official-models"]
condition = "discover-official-models.available.gemini == true"
execution = "script"
idempotent = true
[steps.script]
command = ["sh", "scripts/project-provider-model-catalog.sh", "{{discover-official-models}}", "gemini"]
format = "text"
timeout = "30s"
[steps.validate]
format = "json"
required = ["provider", "available", "models"]

[[steps]]
id = "catalog-pollinations"
title = "裁剪 Pollinations 官方候选目录"
depends_on = ["discover-official-models"]
condition = "discover-official-models.available.pollinations == true"
execution = "script"
idempotent = true
[steps.script]
command = ["sh", "scripts/project-provider-model-catalog.sh", "{{discover-official-models}}", "pollinations"]
format = "text"
timeout = "30s"
[steps.validate]
format = "json"
required = ["provider", "available", "models"]

[[steps]]
id = "catalog-dashscope"
title = "裁剪 DashScope 官方候选目录"
depends_on = ["discover-official-models"]
condition = "discover-official-models.available.dashscope == true"
execution = "script"
idempotent = true
[steps.script]
command = ["sh", "scripts/project-provider-model-catalog.sh", "{{discover-official-models}}", "dashscope"]
format = "text"
timeout = "30s"
[steps.validate]
format = "json"
required = ["provider", "available", "models"]

[[steps]]
id = "catalog-siliconflow"
title = "裁剪 SiliconFlow 官方候选目录"
depends_on = ["discover-official-models"]
condition = "discover-official-models.available.siliconflow == true"
execution = "script"
idempotent = true
[steps.script]
command = ["sh", "scripts/project-provider-model-catalog.sh", "{{discover-official-models}}", "siliconflow"]
format = "text"
timeout = "30s"
[steps.validate]
format = "json"
required = ["provider", "available", "models"]

[[steps]]
id = "catalog-zai"
title = "裁剪 Z.AI 官方候选目录"
depends_on = ["discover-official-models"]
condition = "discover-official-models.available.zai == true"
execution = "script"
idempotent = true
[steps.script]
command = ["sh", "scripts/project-provider-model-catalog.sh", "{{discover-official-models}}", "zai"]
format = "text"
timeout = "30s"
[steps.validate]
format = "json"
required = ["provider", "available", "models"]

[[steps]]
id = "research-new-providers"
title = "发现新的免费 Provider"
depends_on = ["normalize-research"]
condition = "select-providers.all == true"
input_context = ["list-providers.stdout"]
description = """
以 Formula 实际运行时刻为准，从官方来源寻找 list-providers.stdout 尚未包含、但提供 OpenAI 兼容 API 且存在长期免费模型或明确免费额度的 Provider。排除已经内置的 Provider、必须自托管的服务、来路不明的中转站和没有官方免费证据的平台。

这是只读调研步骤：不得创建或修改工作区文件，不得安装 Skill、依赖或工具，不得执行注册、登录、写 API 等外部操作；只能在最终响应中返回指定 JSON。

每个候选必须至少有一个直接证明免费政策的官方价格页或官方文档 URL；只有注册页、首页或通用 API 文档不算免费证据。无法确认免费额度的数值、有效期或适用模型时不得猜测，直接排除该候选。试用额度必须明确标记为 trial，不能描述成长期免费。

输出 ONLY compact JSON：
{"candidates":[{"id":"...","base_url":"...","register_url":"...","api_key_env":"...","free_basis":"...","source_urls":["官方 URL"],"models":[]}],"notes":"..."}
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
required = ["candidates"]

[[steps]]
id = "normalize-new-providers"
title = "校验并去重新 Provider 候选"
depends_on = ["list-providers", "research-new-providers"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/normalize-provider-candidates.sh", "{{list-providers.stdout}}", "{{research-new-providers}}", "{{provider}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["candidates", "rejected_candidate_ids"]

[[steps]]
id = "load-current-manifest"
title = "读取当前免费模型清单"
execution = "script"
idempotent = true

[steps.script]
command = ["cat", "internal/provider/free-models.json"]
format = "json"
timeout = "10s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "build-manifest"
title = "生成权威模型清单"
depends_on = ["capture-run-time", "resolve-inventory", "load-current-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/build-free-model-manifest.sh", "{{load-current-manifest.stdout}}", "{{resolve-inventory}}", "{{capture-run-time.timestamp}}", ".tt/candidates/free-models-{{capture-run-time.file_token}}.json"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["schema_version", "providers"]

[[steps]]
id = "validate-candidate"
title = "严格验证候选模型清单"
depends_on = ["build-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/validate-free-model-candidate.sh", ".tt/candidates/free-models-{{capture-run-time.file_token}}.json"]
format = "text"
timeout = "5m"

[steps.validate]
format = "json"
required = ["valid", "error", "provider_count", "model_count"]

[[steps]]
id = "resolve-inventory"
title = "确定各 Provider 最终模型源"
depends_on = ["select-providers", "normalize-research", "discover-official-models", "load-current-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/resolve-free-model-inventory.sh", "{{load-current-manifest.stdout}}", "{{select-providers.stdout}}", "{{normalize-research}}", "{{discover-official-models}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["results", "model_count", "updated_provider_ids", "abandoned_provider_ids", "preserved_provider_ids"]

[[steps]]
id = "quality-gate"
title = "执行清单写入门禁"
depends_on = ["load-current-manifest", "build-manifest", "resolve-inventory", "validate-candidate"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/check-free-model-manifest-quality.sh", "internal/provider/free-models.json", ".tt/candidates/free-models-{{capture-run-time.file_token}}.json", "{{resolve-inventory}}", "{{validate-candidate}}", "{{allow_large_changes}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["approved", "changed", "candidate_valid", "large_changes_allowed", "before_model_count", "after_model_count", "added_model_count", "removed_model_count", "changes", "violations", "rejection_reasons"]

[[steps]]
id = "write-manifest"
title = "写入免费模型清单"
depends_on = ["build-manifest", "quality-gate"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/write-free-model-manifest.sh", ".tt/candidates/free-models-{{capture-run-time.file_token}}.json", "{{quality-gate.approved}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["directory", "files"]

[[steps]]
id = "validate-manifest"
title = "验证免费模型清单"
depends_on = ["write-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["go", "run", ".", "validate-model-data", "internal/provider/free-models.json"]
format = "text"
timeout = "5m"

[[steps]]
id = "report-data"
title = "整理运行审计摘要"
depends_on = ["validate-manifest", "normalize-new-providers", "normalize-research", "resolve-inventory", "discover-official-models", "validate-candidate", "quality-gate", "write-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/summarize-free-model-run.sh", "{{provider}}", "{{capture-run-time.timestamp}}", "internal/provider/free-models.json", ".tt/candidates/free-models-{{capture-run-time.file_token}}.json", "{{normalize-research}}", "{{resolve-inventory}}", "{{discover-official-models}}", "{{validate-candidate}}", "{{quality-gate}}", "{{normalize-new-providers}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["target_provider", "attempted_at", "manifest_applied", "candidate_validation", "quality_gate", "research", "inventory", "official_catalog", "new_providers", "manifest"]

[[steps]]
id = "report"
title = "生成模型发现报告"
depends_on = ["report-data"]
input_context = ["report-data"]
description = """
根据 report-data 生成简洁、可执行的中文 Markdown 报告。

报告必须包含：运行结论、候选清单严格校验结果、清单是否写入、模型总数变化、官方 /models 更新的 Provider、Agent 更新的 Provider、因 Agent 无法获得模型而放弃的 Provider、官方接口失败后保留旧数据的 Provider、调研拒绝以及下一步建议。如果候选校验或质量门禁未通过，必须突出说明正式清单保持不变；如果因大规模变化熔断，列出需要人工复核的 Provider，但不要建议未经复核直接放行。

只输出 Markdown，不输出 JSON，不复述原始日志或完整错误正文；错误按 provider/model 聚合，保留足够定位的信息即可。不得臆测模型被删除的具体原因：审计数据未给出原因时，只能表述为“不在本次权威结果中”。
"""

[steps.agent]
name = "reporter"
