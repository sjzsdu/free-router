只使用百川官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"baichuan","free_basis":"...","billing_warning":"赠送金规则","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
