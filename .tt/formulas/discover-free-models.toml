只使用百度官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"qianfan","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"context_length":0,"source_urls":["官方免费模型文档"]}],"notes":"..."}
"""
