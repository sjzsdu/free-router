formula = "discover-free-models"
description = "并发核验各 Provider 的免费模型，并生成 free-router 使用的版本化模型清单。"
version = 1
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "go"
command = "go"
message = "需要 Go 来验证生成的模型清单。"

[[preflight.checks]]
type = "git"
name = "repository"
require_repo = true
message = "请在 free-router 仓库中运行此 Formula。"

[[preflight.checks]]
type = "path"
name = "manifest-directory"
path = "internal/provider"
message = "找不到 internal/provider，请在 free-router 仓库根目录运行。"

# 所有 research-* 步骤无相互依赖，Formula 运行时会并发执行。
# 每个步骤只负责一个 Provider，避免某个平台超时拖住其他数据源。

[[steps]]
id = "capture-run-time"
title = "记录本次核验时间"
execution = "script"
[steps.script]
command = ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]
format = "text"
timeout = "10s"
idempotent = true
[steps.validate]
format = "json"
required = ["exit_code", "stdout", "stderr"]

[[steps]]
id = "research-openrouter"
title = "核验 OpenRouter 免费模型"
description = """
以 Formula 实际运行时刻为准调研 openrouter。只使用官网文档、官方价格页或官方 API 响应作为证据；识别无需付费、长期免费、试用额度三者的区别。输出 ONLY compact JSON，字段为 provider、policy、free_basis、billing_warning、source_urls、models、notes。policy 只能是 inventory|zero-price|all-listed|unverified。models 每项可包含 id,name,type,functions,context_length,max_output_tokens,input_modalities,output_modalities,supported_parameters,supported_endpoints,free_basis,source_urls,verified_at,pricing。pricing 包含 prompt 和 completion；未知时留空，禁止把免费额度写成零价格。verified_at 使用实际核验时刻。没有可靠证据时 models=[] 且 policy=unverified，禁止猜测。
"""
[steps.agent]
name = "planner"
[steps.validate]
format = "json"
required = ["provider", "policy", "free_basis", "billing_warning", "source_urls", "models", "notes"]

[[steps]]
id = "research-groq"
title = "核验 Groq 免费模型"
description = "以 Formula 实际运行时刻为准调研 groq。只使用官方证据。输出 ONLY compact JSON：{\"provider\":\"groq\",\"policy\":\"inventory|zero-price|all-listed|unverified\",\"free_basis\":\"...\",\"billing_warning\":\"\",\"source_urls\":[],\"models\":[],\"notes\":\"...\"}。models 尽量补齐能力、模态、上下文、pricing 和官方证据，并用实际核验时刻填写 verified_at；未知价格留空，免费额度不得写成零价格；无可靠证据时 policy=unverified，禁止猜测。"
[steps.agent]
name = "planner"
[steps.validate]
format = "json"
required = ["provider", "policy", "free_basis", "billing_warning", "source_urls", "models", "notes"]

