formula = "discover-free-models"
description = "并发核验全部内置 Provider 的免费模型，并生成 free-router 使用的版本化模型清单。"
version = 5
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "go"
command = "go"
message = "需要 Go 来读取 Provider 列表并验证生成的模型清单。"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要 jq 来保守合并并校验生成的模型清单。"

[[preflight.checks]]
type = "git"
name = "repository"
require_repo = true
message = "请在 free-router 仓库中运行此 Formula。"

[[preflight.checks]]
type = "path"
name = "manifest-directory"
path = "internal/provider"
message = "找不到 internal/provider，请在 free-router 仓库根目录运行。"

[[steps]]
id = "capture-run-time"
title = "记录本次核验时间"
execution = "script"
idempotent = true

[steps.script]
command = ["date", "-u", "+{\"timestamp\":\"%Y-%m-%dT%H:%M:%SZ\"}"]
format = "json"
timeout = "10s"

[steps.validate]
format = "json"
required = ["timestamp"]

[[steps]]
id = "list-providers"
title = "读取内置 Provider 列表"
execution = "script"
idempotent = true

[steps.script]
command = ["go", "run", ".", "providers"]
format = "json"
timeout = "5m"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "research-providers"
title = "并发核验各 Provider 免费模型"
depends_on = ["list-providers"]

[steps.loop]
for_each = "list-providers.stdout"
var = "provider"
parallel = true
max_concurrency = 6

[[steps.loop.body]]
id = "research-provider"
title = "核验 {{provider.id}} 免费模型"
description = """
以 Formula 实际运行时刻为准调研 {{provider.id}}。当前内置资料：tier={{provider.tier}}，free_kind={{provider.free_kind}}，register_url={{provider.register_url}}。

这是只读调研步骤：不得创建或修改工作区文件，不得安装 Skill、依赖或工具，不得执行注册、登录、写 API 等外部操作；只能在最终响应中返回指定 JSON。

只使用 Provider 官网文档、官方价格页或官方 API 响应作为证据。必须区分永久零价、Provider 免费层、赠送额度和限时试用；模型存在不代表免费，也不代表 OpenAI 兼容端点可调用。无法从官方来源确认时使用 policy=unverified、models=[]，禁止猜测。

只能返回当前 Provider 的一个 JSON 对象；provider 必须严格等于 "{{provider.id}}"，policy 必须选择一个实际值，禁止原样返回候选串。输出 ONLY compact JSON：
{"provider":"{{provider.id}}","policy":"inventory|zero-price|all-listed|unverified","free_basis":"...","billing_warning":"","source_urls":["官方 URL"],"models":[],"notes":"..."}

有可靠的具体免费模型时使用 inventory。每个模型尽量提供 id、name、type、functions、context_length、max_output_tokens、input_modalities、output_modalities、supported_parameters、supported_endpoints、free_basis、source_urls、pricing。functions 只能使用 chat、chat-tools、image-understanding、image-generation、video-understanding、video-generation、audio-understanding、speech-to-text、text-to-speech、embedding、rerank、moderation。pricing 未知时留空；免费额度不得写成零价格。
"""

[steps.loop.body.agent]
name = "assistant"

[steps.loop.body.validate]
format = "json"
required = ["provider", "policy", "models"]

[[steps]]
id = "normalize-research"
title = "校验并归一化 Provider 调研结果"
depends_on = ["list-providers", "research-providers"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/normalize-free-model-research.sh", "{{list-providers.stdout}}", "{{research-providers}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
min_items = 1
item_required = ["provider", "policy", "models", "accepted"]

[[steps]]
id = "discover-callable-models"
title = "从官方接口发现并验证可调用模型"
execution = "script"

[steps.script]
command = ["go", "run", ".", "discover-model-data"]
format = "text"
timeout = "45m"

[steps.validate]
format = "json"
required = ["providers", "fetch_failures", "probe_failures"]

[[steps]]
id = "research-new-providers"
title = "发现新的免费 Provider"
depends_on = ["normalize-research"]
input_context = ["list-providers.stdout"]
description = """
以 Formula 实际运行时刻为准，从官方来源寻找 list-providers.stdout 尚未包含、但提供 OpenAI 兼容 API 且存在长期免费模型或明确免费额度的 Provider。排除已经内置的 Provider、必须自托管的服务、来路不明的中转站和没有官方免费证据的平台。

这是只读调研步骤：不得创建或修改工作区文件，不得安装 Skill、依赖或工具，不得执行注册、登录、写 API 等外部操作；只能在最终响应中返回指定 JSON。

每个候选必须至少有一个直接证明免费政策的官方价格页或官方文档 URL；只有注册页、首页或通用 API 文档不算免费证据。无法确认免费额度的数值、有效期或适用模型时不得猜测，直接排除该候选。试用额度必须明确标记为 trial，不能描述成长期免费。

输出 ONLY compact JSON：
{"candidates":[{"id":"...","base_url":"...","register_url":"...","api_key_env":"...","free_basis":"...","source_urls":["官方 URL"],"models":[]}],"notes":"..."}
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
required = ["candidates"]

[[steps]]
id = "normalize-new-providers"
title = "校验并去重新 Provider 候选"
depends_on = ["list-providers", "research-new-providers"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/normalize-provider-candidates.sh", "{{list-providers.stdout}}", "{{research-new-providers}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["candidates", "rejected_candidate_ids"]

[[steps]]
id = "load-current-manifest"
title = "读取当前免费模型清单"
execution = "script"
idempotent = true

[steps.script]
command = ["cat", "internal/provider/free-models.json"]
format = "json"
timeout = "10s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "build-manifest"
title = "合并免费模型清单"
depends_on = ["capture-run-time", "normalize-research", "load-current-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/build-free-model-manifest.sh", "{{load-current-manifest.stdout}}", "{{normalize-research}}", "{{capture-run-time.timestamp}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["schema_version", "providers"]

[[steps]]
id = "write-manifest"
title = "写入免费模型清单"
depends_on = ["apply-probed-inventory"]
execution = "script"

[steps.script]
command = ["sh", "scripts/write-free-model-manifest.sh", "{{apply-probed-inventory}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["directory", "files"]

[[steps]]
id = "apply-probed-inventory"
title = "写入通过调用验证的模型目录"
depends_on = ["build-manifest", "discover-callable-models", "capture-run-time"]
execution = "script"
idempotent = true

[steps.script]
command = ["sh", "scripts/apply-probed-inventory.sh", "{{build-manifest}}", "{{discover-callable-models}}", "{{capture-run-time.timestamp}}"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["schema_version", "providers"]

[[steps]]
id = "validate-manifest"
title = "验证免费模型清单"
depends_on = ["write-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["go", "run", ".", "validate-model-data", "internal/provider/free-models.json"]
format = "text"
timeout = "5m"

[[steps]]
id = "report"
title = "报告清单更新结果"
depends_on = ["validate-manifest", "normalize-new-providers", "normalize-research", "discover-callable-models", "write-manifest"]
execution = "script"
idempotent = true

[steps.script]
command = ["jq", "-c", "--arg", "discovery", "{{normalize-new-providers}}", "--arg", "research", "{{normalize-research}}", "--arg", "probed", "{{discover-callable-models}}", "--arg", "write", "{{write-manifest}}", "--arg", "attempted_at", "{{capture-run-time.timestamp}}", ". as $manifest | ($discovery | fromjson | if type == \"string\" then fromjson else . end) as $new | ($research | fromjson | if type == \"string\" then fromjson else . end) as $checked | ($probed | fromjson | if type == \"string\" then fromjson else . end) as $verified | ($write | fromjson | if type == \"string\" then fromjson else . end) as $saved | {schema_version, generated_at, attempted_at:$attempted_at, manifest_changed:($saved.changed // false), provider_count:(.providers | length), model_count:([.providers[] | (.models // [])] | flatten | length), policies:(reduce (.providers[] | .policy) as $policy ({}; .[$policy] = ((.[$policy] // 0) + 1))), callable_provider_count:(($verified.providers // []) | length), fetch_failure_count:(($verified.fetch_failures // []) | length), probe_failure_count:(($verified.probe_failures // []) | length), accepted_research_count:([$checked[] | select(.accepted == true)] | length), rejected_research_count:([$checked[] | select(.accepted != true)] | length), rejected_provider_ids:[$checked[] | select(.accepted != true) | .provider], new_provider_candidates:(($new.candidates // []) | map(.id)), rejected_candidate_ids:($new.rejected_candidate_ids // []), discovery_notes:($new.notes // \"\")}", "internal/provider/free-models.json"]
format = "text"
timeout = "30s"

[steps.validate]
format = "json"
required = ["schema_version", "generated_at", "attempted_at", "manifest_changed", "provider_count", "model_count", "policies", "accepted_research_count", "rejected_research_count", "rejected_provider_ids", "new_provider_candidates", "rejected_candidate_ids"]
