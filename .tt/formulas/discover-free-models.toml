id = "research-xiaomi-mimo"
title = "核验 Xiaomi MiMo 赠送额度模型"
depends_on = ["select-providers"]
condition = "select-providers.research_xiaomi_mimo == true"
description = """
只调研 Xiaomi MiMo 开放平台。核对 https://platform.xiaomimimo.com/ 的官方模型、API 和赠送额度说明。明确这是赠送 credits、免费试用还是长期免费；仅收录当前可通过官方 API 调用且赠送额度适用的具体模型 ID。官网无法公开确认具体 ID 时返回空数组。

只使用小米官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"xiaomi-mimo","free_basis":"...","billing_warning":"赠送额度有效期和耗尽行为","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方 URL"]}],"notes":"..."}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "models"]

[[steps]]
id = "research-dashscope"
title = "核验阿里云百炼免费额度模型"
depends_on = ["select-providers", "catalog-dashscope"]
condition = "discover-official-models.available.dashscope == true"
input_context = ["catalog-dashscope"]
description = """
只调研阿里云百炼 DashScope。以 catalog-dashscope 中官方 /models 返回的 ID 为候选全集，再核对 https://help.aliyun.com/zh/model-studio/getting-started/models 、模型价格页和免费额度页。逐模型确认免费额度、有效期和地域；禁止输出官方接口候选全集之外的 ID，不要把“新用户免费额度”写成永久零价。

只使用阿里云官方来源；只读调研。输出 ONLY compact JSON：
{"provider":"dashscope","free_basis":"...","billing_warning":"额度和有效期","source_urls":["官方 URL"],"models":[{"id":"...","functions":["chat"],"source_urls":["官方模型页"]}],"notes":"..."}
输出必须是一个可直接解析的 JSON object，且必须始终包含 provider、free_basis、billing_warning、source_urls、models、notes 六个字段。models 必须是 JSON array；没有可靠官方证据、官方目录不可用或没有符合条件的模型时，也不得省略该字段，必须返回：{"provider":"dashscope","free_basis":"","billing_warning":"","source_urls":[],"models":[],"notes":"未获得可靠的官方免费模型证据"}
"""
[steps.agent]
name = "assistant"
[steps.validate]
format = "json"
required = ["provider", "free_basis", "billing_warning", "source_urls", "models", "notes"]

