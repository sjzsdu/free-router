name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - id: version
        name: Resolve version from tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then tag="$DISPATCH_TAG"; fi
          [[ "$tag" == v* ]] || tag="v$tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be a semantic version like v1.2.3, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - id: release
        name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a release; nothing to build"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build admin
        run: |
          npm ci --prefix web
          npm run build --prefix web
          git diff --exit-code -- internal/admin/dist
      - name: Check
        run: make check
      - name: Race test
        run: make test-race

  build:
    needs: [prepare, test]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build admin
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p build dist
          binary="free-router"
          if [[ "$GOOS" == "windows" ]]; then binary="free-router.exe"; fi
          if [[ "$GOOS" == "darwin" ]]; then
            export CGO_ENABLED=1
            export CC="clang -arch $([[ "$GOARCH" == "arm64" ]] && echo arm64 || echo x86_64)"
          else
            export CGO_ENABLED=0
          fi
          go build -trimpath -ldflags="-s -w -X main.buildVersion=$VERSION" -o "build/$binary" .
          archive="free-router_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd build && zip -9 "../dist/${archive}.zip" "$binary")
          else
            tar -C build -czf "dist/${archive}.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: free-router-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/* > dist/checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --title "free-router $VERSION" \
            --generate-notes
